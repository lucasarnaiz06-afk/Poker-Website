name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poker_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Shared tests derive poker_platform_test from this and refuse any other database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/poker_platform?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Engine tests
        run: npm run test:engine
      - name: Server tests
        run: npm test --workspace server
      - name: Client tests
        run: npm test --workspace client
      - name: Shared tests (Postgres)
        run: npm test --workspace packages/shared
